name: Atualizar Historico SUS

on:
  schedule:
    - cron: '17 19 * * *' 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Instalar o Requests
        run: pip install requests

      - name: Executar o script
        run: python dados.py

      - name: Salvar (Comitar) o histórico atualizado
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico.txt
          git commit -m "Atualizando histórico: $(date)" || echo "Nenhuma mudança para comitar"
          git push
