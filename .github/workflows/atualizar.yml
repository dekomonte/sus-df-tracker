name: Atualizar-Historico-SUS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar o Requests
        run: pip install requests
      
      - name: Executar o script
        run: python dados.py
      
      - name: Salvar (Comitar) o histórico atualizado
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add historico.txt
          if git commit -m "Atualizando histórico: $(date)"; then
            git push
          fi
