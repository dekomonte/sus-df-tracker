name: Atualizar-Historico-SUS

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dados.py'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar o Requests
        run: pip install requests
      
      - name: Executar o script
        run: python dados.py
      
      - name: Salvar (Comitar) o histórico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizando histórico: $(date)" && git push)
        continue-on-error: true
